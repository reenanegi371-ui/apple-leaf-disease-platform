version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: leafhealth-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend/models:/app/models
      - ../backend/logs:/app/logs
      - ../backend/temp:/app/temp
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/app/models/best.onnx
    networks:
      - leafhealth-network
    restart: unless-stopped

  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.website
    container_name: leafhealth-website
    ports:
      - "5000:5000"
    volumes:
      - ../website/static/uploads:/app/static/uploads
      - ../website/logs:/app/logs
    environment:
      - FLASK_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - leafhealth-network
    restart: unless-stopped

networks:
  leafhealth-network:
    driver: bridge