services:
  - type: web
    name: apple-leaf-disease-backend
    runtime: python
    pythonVersion: 3.13
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: False
      - key: LOG_LEVEL
        value: INFO
      - key: MOCK_MODE
        value: False
      - key: MODEL_PATH
        value: models/best.pt
