{% extends "base.html" %}

{% block title %}Page Not Found - LeafHealth AI{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-icon">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            The page you are looking for might have been removed, had its name changed, 
            or is temporarily unavailable.
        </p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <span class="btn-icon">🏠</span>
                Go to Homepage
            </a>
            <a href="/detect" class="btn btn-secondary">
                <span class="btn-icon">🔍</span>
                Try Detection
            </a>
        </div>
    </div>
</div>

<style>
.error-container {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
}

.error-content {
    max-width: 500px;
}

.error-icon {
    font-size: 8rem;
    font-weight: bold;
    color: var(--primary-color);
    line-height: 1;
    margin-bottom: 1rem;
    opacity: 0.2;
}

.error-title {
    font-size: 2rem;
    color: var(--text-dark);
    margin-bottom: 1rem;
}

.error-message {
    font-size: 1.1rem;
    color: #666;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
}

@media (max-width: 768px) {
    .error-icon {
        font-size: 6rem;
    }
    
    .error-title {
        font-size: 1.5rem;
    }
    
    .error-actions {
        flex-direction: column;
    }
    
    .error-actions .btn {
        width: 100%;
    }
}
</style>
{% endblock %}
